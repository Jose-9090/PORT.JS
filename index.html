<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./sty.css">
    <title>Login | meu</title>
</head>

<body>
    <div class="lamp-cena" id="lampCena">
        <div class="lamp-glow"></div>
        <svg class="lamp-svg" viewBox="0 0 180 300">
            <ellipse cx="90" cy="272" rx="50" ry="10" fill="#1a1a1a" />
            <rect x="70" y="250" width="40" height="16" rx="4" fill="#1a1a1a" />
            <path d="M85 95 L85 250" stroke="#2a2a2a" stroke-width="5" />
            <path class="lamp-shade" d="M15 95 L75 40 H105 L165 95 Z" fill="#121212" stroke="#ff8c00" stroke-width="3" />
            <line x1="90" y1="40" x2="90" y2="28" stroke="#ff8c00" stroke-width="3" />
            <circle cx="90" cy="24" r="4" fill="#ff8c00" />
            <circle class="lamp-bulb" cx="90" cy="112" r="9" fill="#fff3e0" />
            <g class="cordao-grupo">
                <path d="M0 0 C -12 34, -9 86, -2 124" stroke="#3a3a3a" stroke-width="3" fill="none" />
                <circle class="lamp-puxador" id="puxador" cx="-2" cy="136" r="9" fill="#ff8c00" />
            </g>
        </svg>
        <p class="lamp-dica">puxe o cordão para acender</p>
    </div>
    <div class="center" id="loginCard">
        <h1>Login</h1>
        <form onsubmit="logar(); return false;">
            <div class="txt_field">
                <input type="email" id="login" required>
                    <label>E-mail</label>
            </div>
            <div class="txt_field">
                <input type="password" id="senha" required>
                    <label>Senha</label>
            </div>
            <div class="pass">
                Esqueceu a Senha!
            </div>
            <div class="botoes">
                <input type="submit" value="Conectar" class="btn-conectar">
                <input type="button" value="Cancelar" class="btn-cancelar" onclick="cancelar()">
            </div>
            <div class="signup_link">
                <a href="#" onclick="abrirCadastro(); return false;">Não é membro? Cadastre-se</a>
            </div>
        </form>
    </div>

    <div class="modal-overlay" id="modalCadastro">
        <div class="center modal-card">
            <h1>Cadastro</h1>
            <form onsubmit="cadastrar(); return false;">
                <div class="txt_field">
                    <input type="text" id="cadNome" required>
                        <label>Nome</label>
                </div>
                <div class="txt_field">
                    <input type="email" id="cadEmail" required>
                        <label>E-mail</label>
                </div>
                <div class="txt_field">
                    <input type="password" id="cadSenha" required>
                        <label>Senha</label>
                </div>
                <div class="botoes">
                    <input type="submit" value="Cadastrar" class="btn-conectar">
                    <input type="button" value="Voltar" class="btn-cancelar" onclick="fecharCadastro()">
                </div>
            </form>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js?v=3"></script>
<script src="./scri.js?v=3"></script>

</html>
