<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./sty.css">
    <title>Login | meu</title>
</head>

<body>
    <div class="lamp-cena" id="lampCena">
        <div class="lamp-glow"></div>
        <svg class="lamp-svg" viewBox="0 0 220 350">
            <defs>
                <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#3a1e06" />
                    <stop offset="0.55" stop-color="#1c0e04" />
                    <stop offset="1" stop-color="#0f0803" />
                </linearGradient>
                <linearGradient id="gStem" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#2b2b2b" />
                    <stop offset="0.5" stop-color="#4a4a4a" />
                    <stop offset="1" stop-color="#222222" />
                </linearGradient>
                <radialGradient id="gBulb" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#fff8d6" />
                    <stop offset="1" stop-color="#d9b86a" />
                </radialGradient>
            </defs>

            <ellipse cx="110" cy="340" rx="66" ry="12" fill="#181818" stroke="#ff8c00" stroke-width="1.5" />
            <ellipse cx="110" cy="336" rx="46" ry="8" fill="#262626" />
            <path d="M98 300 H122 L132 336 H88 Z" fill="#1f1f1f" stroke="#ff8c00" stroke-width="1" />
            <rect x="104" y="120" width="12" height="182" rx="6" fill="url(#gStem)" />
            <rect x="108" y="120" width="3" height="182" rx="1.5" fill="#555555" opacity="0.5" />

            <ellipse cx="110" cy="62" rx="21" ry="5" fill="#120802" stroke="#ff8c00" stroke-width="1" opacity="0.9" />
            <path class="lamp-shade" d="M89 62 L31 118 Q110 132 189 118 L131 62 Z" fill="url(#gShade)" stroke="#ff8c00"
                stroke-width="1.5" />
            <path d="M38 118 Q110 131 182 118" stroke="#ff8c00" stroke-width="2.5" fill="none" />
            <path d="M89 62 L31 118 L38 118 L96 62 Z" fill="#ffffff" opacity="0.03" />
            <circle class="lamp-bulb" cx="110" cy="126" r="11" fill="url(#gBulb)" stroke="#c99a3a" stroke-width="1" />

            <path d="M110 40 L110 24 M110 24 H104" stroke="#ff8c00" stroke-width="3" stroke-linecap="round" fill="none" />
            <circle cx="110" cy="22" r="5" fill="#ff8c00" />

            <g class="cordao-grupo" id="cordao">
                <path d="M183 116 C 200 150, 194 210, 187 258" stroke="#3a3a3a" stroke-width="2.5" fill="none" />
                <circle cx="182" cy="138" r="2" fill="#555555" />
                <circle cx="186" cy="164" r="2" fill="#555555" />
                <circle cx="188" cy="190" r="2" fill="#555555" />
                <circle cx="188" cy="216" r="2" fill="#555555" />
                <circle cx="187" cy="240" r="2" fill="#555555" />
                <path d="M187 258 v6" stroke="#3a3a3a" stroke-width="2.5" />
                <circle class="lamp-puxador" cx="187" cy="268" r="12" fill="#ff8c00" stroke="#7a4100"
                    stroke-width="1" />
                <circle class="lamp-hit" cx="187" cy="268" r="22" fill="#ff8c00" opacity="0" />
            </g>
        </svg>
        <p class="lamp-dica">puxe o cordão para acender</p>
    </div>
    <div class="center" id="loginCard">
        <h1>Login</h1>
        <form onsubmit="logar(); return false;">
            <div class="txt_field">
                <input type="email" id="login" required>
                    <label>E-mail</label>
            </div>
            <div class="txt_field">
                <input type="password" id="senha" required>
                    <label>Senha</label>
            </div>
            <div class="pass">
                Esqueceu a Senha!
            </div>
            <div class="botoes">
                <input type="submit" value="Conectar" class="btn-conectar">
                <input type="button" value="Cancelar" class="btn-cancelar" onclick="cancelar()">
            </div>
            <div class="signup_link">
                <a href="#" onclick="abrirCadastro(); return false;">Não é membro? Cadastre-se</a>
            </div>
        </form>
    </div>

    <div class="modal-overlay" id="modalCadastro">
        <div class="center modal-card">
            <h1>Cadastro</h1>
            <form onsubmit="cadastrar(); return false;">
                <div class="txt_field">
                    <input type="text" id="cadNome" required>
                        <label>Nome</label>
                </div>
                <div class="txt_field">
                    <input type="email" id="cadEmail" required>
                        <label>E-mail</label>
                </div>
                <div class="txt_field">
                    <input type="password" id="cadSenha" required>
                        <label>Senha</label>
                </div>
                <div class="botoes">
                    <input type="submit" value="Cadastrar" class="btn-conectar">
                    <input type="button" value="Voltar" class="btn-cancelar" onclick="fecharCadastro()">
                </div>
            </form>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js?v=3"></script>
<script src="./scri.js?v=3"></script>

</html>
